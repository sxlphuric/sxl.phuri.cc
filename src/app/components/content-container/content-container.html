<div class="col align-middle paper container-lg main-container">
  <div class="header">
  <div class="banner">
    <img
      class="no-responsive no-border"
      src="aesthetic-banner.jpg"
      alt="aesthetic banner representing a blue, cloudy sky"
    />
  </div>
  <div class="nav">
    <button class="active redaction-50-regular">home</button>
    <button class="redaction-50-regular">projects</button>
    <button class="redaction-50-regular">stuff</button>
    <button class="redaction-50-regular"></button>
    <button class="last-element redaction-50-regular"></button>
  </div>
  </div>
  <div class="content row">
    <div class="content-left">
      <div class="row-container">
        <div class="container-sm paper background" style="flex: 4;">
          <app-md-title text="Thoughts"/>
        </div>
        <div class="container-sm paper background" style="flex: 3;">
          <app-md-title text="Contact"/>
        </div>
      </div>
      <div class="container-sm paper background">
        <app-md-title text="Blog"/>
      </div>
      <div class="row-container">
              <div class="container-sm paper background">
                <app-md-title text="Status"/>
              </div>
              <div class="container-sm paper background">
                <app-md-title text="Buttons"/>
              </div>
            </div>
      <div class="container-sm paper background">
        <app-md-title text="Gallery"/>
      </div>

      <app-link-buttons />
    </div>
    <div class="content-right">
      <!-- reminder: Navbar, Currently (music, weather, discord activity), Cooking images, Buttons -->
      <div class="container-sm paper background">
        <app-md-title-lower text="me" />
        <img alt="void linux logo in a nature environment" src="profile.jpg" />
        <app-data-table [cells]="aboutMeTableData" />
        <div class="box">
          I like doing random stuff, because I can.
          <br/>
          Yeah. That's kinda it.
        </div>
      </div>
      <div class="container-sm paper background">
        <app-md-title-lower text="things i love" />
        <ul class="decorative-list">
          <li>cooking</li>
          <li class="list-border-element">
            <span class="text">flute</span>
          </li>
          <li>programming</li>
        </ul>
      </div>
      <div class="container-sm paper background">
              <app-md-title-lower text="website updates" />
              <app-md-quote text="this website uses angular!"/>
               <app-data-table [cells]="websiteUpdateData"/>
            </div>
    </div>
  </div>
</div>
