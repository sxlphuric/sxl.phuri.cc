<div class="col align-middle paper container-lg main-container">
  <div class="header">
  <div class="banner">
    <img
      class="no-responsive no-border"
      src="aesthetic-banner.jpg"
      alt="aesthetic banner representing a blue, cloudy sky"
    />
  </div>
  <div class="nav">
    <button [class.active]="currentTab() === home.innerHTML" class="redaction-50-regular" #home (click)="currentTab.set(home.innerHTML)">home</button>
    <button [class.active]="currentTab() === projects.innerHTML" class="redaction-50-regular" #projects (click)="currentTab.set(projects.innerHTML)">projects</button>
    <button [class.active]="currentTab() === stuff.innerHTML" class="redaction-50-regular" #stuff (click)="currentTab.set(stuff.innerHTML)">stuff</button>
    <button [class.active]="currentTab() === gallery.innerHTML" class="last-element redaction-50-regular" #gallery (click)="currentTab.set(gallery.innerHTML)">gallery</button>
    <!--button class="last-element redaction-50-regular">{{currentTab.nativeElement.innerHTML}}</button-->
  </div>
  </div>
  <div class="content row">
    <div class="content-left">
      @if (currentTab() === "home") {
      <page-home class="page"/>
      }
          </div>
    <div class="content-right">
      <!-- reminder: Navbar, Currently (music, weather, discord activity), Cooking images, Buttons -->
      <div class="container-sm paper background">
        <app-md-title-lower text="me" />
        <img alt="void linux logo in a nature environment" src="profile.jpg" />
        <app-data-table [cells]="aboutMeTableData" />
        <div class="box">
          I like doing random stuff, because I can.
          <br/>
          Yeah. That's kinda it.
        </div>
      </div>
      <div class="container-sm paper background">
        <app-md-title-lower text="things i love" />
        <ul class="decorative-list">
          <li>cooking</li>
          <li class="list-border-element">
            <span class="text">flute</span>
          </li>
          <li>programming</li>
        </ul>
      </div>
      <div class="container-sm paper background">
              <app-md-title-lower text="website updates" />
              <app-md-quote text="this website uses angular!"/>
               <app-data-table [cells]="websiteUpdateData"/>
            </div>
    </div>
  </div>
</div>
